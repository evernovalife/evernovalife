<body class="adm">
  <a class="skip-link" href="#admBody">Skip to content</a>

  <!-- The whole console is built by js/admin-console.js into this mount:
       the left rail, the sticky bar and the view. Four sections share one
       set of data (orders, users, plans, products) and one set of styles,
       so building them from one script beats four near-identical pages. -->
  <div class="adm-shell" id="adminShell">
    <noscript>
      <div style="padding:2rem">
        <h1>Admin</h1>
        <p>The admin console needs JavaScript — it talks to the API directly.</p>
      </div>
    </noscript>
  </div>

  <script src="js/config.js?v=83"></script>
  <script src="js/admin-core.js?v=83"></script>
  <!-- The shipping-label renderer: builds a label from the saved design + one
       order, for both the designer's preview and the print sheet. -->
  <script src="js/admin-labels.js?v=83"></script>
  <!-- The dispute queue and thread view: its own file because a message
       stream with a composer is a screen, not a section. -->
  <script src="js/admin-disputes.js?v=83"></script>
  <script src="js/live.js?v=83"></script>
  <script src="js/admin-console.js?v=83"></script>
</body>
