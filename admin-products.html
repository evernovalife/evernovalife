<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Products — Ever Nova Life Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07040f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter, loaded off the critical path. As a plain stylesheet link this
       blocked first paint on a third-party host; with display=swap the page
       already renders in system-ui first, so the block bought nothing. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=56">
  <link rel="stylesheet" href="css/admin.css?v=56">
  <!-- 21+ age gate: runs before anything paints -->
  <script src="js/age-gate.js?v=56"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20.00 1.00 L21.91 15.38 L27.78 12.22 L24.62 18.09 L39.00 20.00 L24.62 21.91 L27.78 27.78 L21.91 24.62 L20.00 39.00 L18.09 24.62 L12.22 27.78 L15.38 21.91 L1.00 20.00 L15.38 18.09 L12.22 12.22 L18.09 15.38 Z' fill='%23a855f7'/%3E%3C/svg%3E">
  <style>
    /* Table styling lives in css/admin.css (.adm-table) — this page only
       carries what is specific to editing a product. */
    .p-thumb { width:44px; height:44px; border-radius:8px; object-fit:cover; background:rgba(255,255,255,0.06); }
    /* The form is a reading task, not a dashboard: past ~900px the fields
       stretch into strips you have to track across. */
    #formCard form { max-width: 900px; }
    .pform-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .pform-grid .full { grid-column:1 / -1; }
    @media (max-width:640px){ .pform-grid { grid-template-columns:1fr; } }
    .spec-row { display:flex; gap:0.5rem; margin-bottom:0.5rem; }
    .spec-row input { flex:1; }
    .img-preview { width:120px; height:120px; border-radius:10px; object-fit:cover; border:1px solid var(--glass-border-strong); background:rgba(255,255,255,0.05); display:none; }
    .row-actions { display:flex; gap:0.4rem; justify-content:flex-end; }

    /* visibility switch — a real switch, so its state is legible without
       hovering and readable to a screen reader via role/aria-checked */
    .vis-toggle { display:flex; align-items:center; gap:.5rem; cursor:pointer; font:inherit;
                  font-size:.78rem; font-weight:600; color:#94a3b8; background:none; border:0; padding:0;
                  white-space:nowrap; }
    .vis-toggle i { width:34px; height:19px; border-radius:999px; flex:none; position:relative;
                    background:rgba(148,163,184,.25); border:1px solid rgba(148,163,184,.35);
                    transition:background .15s ease, border-color .15s ease; }
    .vis-toggle i::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px;
                           border-radius:50%; background:#cbd5e1; transition:transform .15s ease, background .15s ease; }
    .vis-toggle.on { color:#6ee7b7; }
    .vis-toggle.on i { background:rgba(16,185,129,.35); border-color:rgba(16,185,129,.55); }
    .vis-toggle.on i::after { transform:translateX(15px); background:#6ee7b7; }
    .vis-toggle:disabled { opacity:.5; cursor:default; }
    /* A hidden product stays legible but visibly out of play. */
    tr.p-hidden td { opacity:.55; }
    tr.p-hidden td:nth-child(5) { opacity:1; }

    .coa-flag { display:block; margin-top:2px; font-size:.7rem; font-weight:600; }
    .coa-flag.ok { color:#6ee7b7; }
    .coa-flag.no { color:#94a3b8; }
    .muted-sm { font-size:0.8rem; color:#94a3b8; }

    /* stock cell — current state above, an inline editor for it below */
    .stock-cell { min-width:190px; }
    .stock-tag { display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.02em;
                 padding:2px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
    .stock-tag.ok        { color:#6ee7b7; background:rgba(16,185,129,0.12); border-color:rgba(16,185,129,0.35); }
    .stock-tag.low       { color:#fcd34d; background:rgba(245,158,11,0.14); border-color:rgba(245,158,11,0.4); }
    .stock-tag.out       { color:#fda4af; background:rgba(244,63,94,0.14);  border-color:rgba(244,63,94,0.4); }
    .stock-tag.off       { color:#fda4af; background:rgba(244,63,94,0.10);  border-color:rgba(244,63,94,0.3); }
    .stock-tag.untracked { color:#94a3b8; background:rgba(148,163,184,0.12); border-color:rgba(148,163,184,0.3); }
    .stock-edit { display:flex; gap:0.35rem; align-items:center; margin-top:0.4rem; }
    .stock-edit input { width:74px; padding:5px 8px; font-size:0.85rem; border-radius:8px;
                        background:rgba(255,255,255,0.05); border:1px solid var(--glass-border-strong); color:#fff; }
    .stock-edit .btn { padding:0.3rem 0.7rem; font-size:0.78rem; }
    .stock-note { display:block; margin-top:0.3rem; font-size:0.74rem; font-weight:600; min-height:1em; }
    .stock-note.success { color:#6ee7b7; }
    .stock-note.error   { color:#fda4af; }
    .feature-warn { margin:0.75rem 0; padding:0.85rem 1rem; border-radius:12px; font-size:0.88rem; line-height:1.5;
                    color:#fde68a; background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.45); }
    .feature-warn code { font-size:0.85em; background:rgba(0,0,0,0.3); padding:1px 5px; border-radius:5px; }
  </style>
</head>
<body class="adm">
  <a class="skip-link" href="#admBody">Skip to content</a>

  <!-- The rail and the top bar are built by js/admin-core.js so this page and
       the dashboard cannot drift apart. Everything below the bar is this
       page's own markup, parked in a <template> until the shell exists. -->
  <div class="adm-shell" id="adminShell"></div>

  <template id="pageView">
      <div id="adminStatus" class="form-msg"></div>
      <!-- shown only when the API predates a tool on this page (checkBackendFeatures) -->
      <div id="featureWarn" class="feature-warn" role="alert" style="display:none"></div>

      <!-- PRODUCT LIST — first, because the job here is almost always
           "change something that already exists", not "add a tenth SKU". -->
      <div class="adm-card">
        <div class="adm-card-head"><h3>All products (<span id="pCount">0</span>)</h3>
          <span class="hint">stock can be changed inline — no need to open the form</span>
          <div class="right"><button class="btn btn-primary btn-sm" type="button" id="newProductBtn">+ Add a product</button></div></div>
        <div id="productList" class="adm-table-wrap"></div>
      </div>

      <!-- ADD / EDIT FORM — hidden until you ask for it. Open by default it
           pushed the list a screen and a half down for no reason. -->
      <div class="adm-card" id="formCard" hidden style="margin-top:1.15rem">
        <div class="adm-card-head"><h3 id="formTitle">Add a product</h3>
          <span class="hint">everything a listing shows: price, size, stock, image, specs</span></div>
        <form id="productForm" novalidate>
          <div class="pform-grid">
            <div class="form-field full">
              <label for="pName">Product name *</label>
              <input type="text" id="pName" placeholder="e.g. BPC-157" required>
            </div>

            <div class="form-field">
              <label for="pCategory">Category</label>
              <select id="pCategory"></select>
            </div>
            <div class="form-field">
              <label for="pBadge">Label / badge <span class="muted-sm">(optional)</span></label>
              <input type="text" id="pBadge" placeholder="e.g. Bestseller, New, Sale">
            </div>

            <div class="form-field">
              <label for="pPrice">Price (USD) *</label>
              <input type="number" id="pPrice" min="0" step="0.01" placeholder="49.99" required>
            </div>
            <div class="form-field">
              <label for="pOriginal">Original price <span class="muted-sm">(optional, for a strikethrough)</span></label>
              <input type="number" id="pOriginal" min="0" step="0.01" placeholder="59.99">
            </div>

            <div class="form-field">
              <label for="pPurity">Purity</label>
              <input type="text" id="pPurity" placeholder="e.g. 99.0%">
            </div>
            <div class="form-field">
              <label for="pQuantity">Size / quantity</label>
              <input type="text" id="pQuantity" placeholder="e.g. 10mg">
            </div>

            <div class="form-field">
              <label for="pLot">Lot #</label>
              <input type="text" id="pLot" placeholder="e.g. ENL-24010">
            </div>
            <div class="form-field">
              <label for="pStock">Units in stock <span class="muted-sm">(leave blank to not count)</span></label>
              <input type="number" id="pStock" min="0" step="1" placeholder="e.g. 24">
              <span class="muted-sm" style="display:block;margin-top:.35rem">Counts down as orders are placed. At 0 the product shows as out of stock and can't be bought. Blank = unlimited, controlled only by the switch below.</span>
            </div>
            <div class="form-field">
              <label>Options</label>
              <label class="form-check" style="margin-top:6px"><input type="checkbox" id="pInStock" checked> <span>Available for sale</span></label>
              <label class="form-check"><input type="checkbox" id="pFeatured"> <span>Featured (show on home page)</span></label>
            </div>

            <div class="form-field full">
              <label for="pDescription">Description</label>
              <textarea id="pDescription" rows="3" placeholder="Short research description…"></textarea>
            </div>

            <div class="form-field full">
              <label>Specifications <span class="muted-sm">(e.g. Molecular Weight → 403.9 g/mol)</span></label>
              <div id="specRows"></div>
              <button type="button" class="btn btn-ghost btn-sm" id="addSpecBtn">+ Add spec row</button>
            </div>

            <!-- CERTIFICATE OF ANALYSIS
                 Every value here is printed verbatim on the product page, so
                 it must be copied off the report, never estimated. The three
                 states are distinct on purpose: "pending" implies a report is
                 coming, which is the wrong thing to say about a reagent that
                 will never have one. -->
            <div class="form-field full">
              <label for="pCoaStatus">Certificate of analysis</label>
              <select id="pCoaStatus">
                <option value="pending">Pending — no report published yet</option>
                <option value="available">Available — report on file</option>
                <option value="not-applicable">Not applicable — this item is a reagent, not a peptide</option>
              </select>
            </div>

            <div id="coaFields" class="form-field full" style="display:none">
              <div class="pform-grid" style="gap:.85rem">
                <div class="form-field"><label for="pCoaLab">Laboratory</label>
                  <input type="text" id="pCoaLab" placeholder="e.g. Janoshik Analytical"></div>
                <div class="form-field"><label for="pCoaReport">Report ID</label>
                  <input type="text" id="pCoaReport" placeholder="e.g. #137638"></div>
                <div class="form-field"><label for="pCoaBatch">Batch analyzed</label>
                  <input type="text" id="pCoaBatch" placeholder="e.g. CS-re10-0322"></div>
                <div class="form-field"><label for="pCoaMethod">Method <span class="muted-sm">(optional)</span></label>
                  <input type="text" id="pCoaMethod" placeholder="e.g. HPLC, UPLC-MS/MS"></div>
                <div class="form-field"><label for="pCoaTested">Sample received</label>
                  <input type="date" id="pCoaTested"></div>
                <div class="form-field"><label for="pCoaIssued">Report issued</label>
                  <input type="date" id="pCoaIssued"></div>
                <div class="form-field"><label for="pCoaPurity">Purity as reported</label>
                  <input type="text" id="pCoaPurity" placeholder="e.g. 99.786% — copy it exactly"></div>
                <div class="form-field"><label for="pCoaContent">Content as reported</label>
                  <input type="text" id="pCoaContent" placeholder="e.g. Retatrutide 11.86 mg"></div>
                <div class="form-field full"><label for="pCoaVerify">Lab verification URL <span class="muted-sm">(optional)</span></label>
                  <input type="url" id="pCoaVerify" placeholder="https://janoshik.com"></div>
              </div>
            </div>

            <div class="form-field full">
              <label for="pCoaNote">COA note <span class="muted-sm">(shown on the page — use it when the report's scope doesn't match this listing)</span></label>
              <textarea id="pCoaNote" rows="2" placeholder="e.g. The report on file analyzed a 10 IU vial of this lot, not the 36 IU quantity listed."></textarea>
            </div>

            <div class="form-field full">
              <label for="pCoaFile">COA document <span class="muted-sm">(PDF or image — buyers open this from the product page)</span></label>
              <input type="file" id="pCoaFile" accept="application/pdf,image/*">
              <div style="display:flex;align-items:center;gap:1rem;margin-top:0.5rem;flex-wrap:wrap">
                <a id="coaFileLink" href="#" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" style="display:none">View current document</a>
                <span class="muted-sm" id="coaFileHint">Leave empty to keep the current document. You can also point at a file already on the site, e.g. <code>assets/coa/137638.pdf</code>.</span>
              </div>
              <input type="text" id="pCoaPath" placeholder="assets/coa/137638.pdf" style="margin-top:0.5rem">
            </div>

            <div class="form-field full">
              <label for="pImage">Product image <span class="muted-sm">(uploaded from your computer; auto-shrunk)</span></label>
              <input type="file" id="pImage" accept="image/*">
              <div style="display:flex;align-items:center;gap:1rem;margin-top:0.6rem">
                <img id="imgPreview" class="img-preview" alt="preview">
                <span class="muted-sm" id="imgHint">Leave empty to keep the current image (research vials use a generated label if none).</span>
              </div>
            </div>
          </div>

          <div class="form-msg" id="formMsg"></div>
          <div style="display:flex;gap:0.6rem;margin-top:0.75rem;flex-wrap:wrap">
            <button class="btn btn-primary" type="submit" id="saveBtn">Add product</button>
            <button class="btn btn-ghost" type="button" id="cancelBtn" style="display:none">Cancel edit</button>
          </div>
        </form>
      </div>

      <!-- admin key fallback -->
      <details id="adminKeyBox" style="margin-top:1rem">
        <summary style="cursor:pointer;color:#94a3b8">Not signed in as admin? Use an admin key</summary>
        <form id="keyForm" style="margin-top:0.75rem;max-width:420px">
          <div class="form-field"><label for="adminKey">Admin key</label><input type="password" id="adminKey" autocomplete="off"></div>
          <button class="btn btn-primary btn-sm" type="submit">Use key</button>
        </form>
      </details>
  </template>

  <script src="js/config.js?v=56"></script>
  <script src="js/admin-core.js?v=56"></script>
  <script>
    /* Build the shell, then drop this page's markup into it. Done before the
       page script runs so every getElementById below still finds its node. */
    (function () {
      var shell = window.Admin.renderShell(document.getElementById('adminShell'), {
        active: 'products',
        title: 'Products',
        subtitle: 'The catalog the storefront and checkout both price from'
      });
      shell.body.appendChild(document.getElementById('pageView').content.cloneNode(true));
      shell.barRight.innerHTML =
        '<a class="btn btn-ghost btn-sm" href="labels.html">' + window.Admin.icon('print', 'ic') + ' Print vial labels</a>' +
        window.Admin.whoChip();
    })();
  </script>
  <script>
  (function () {
    var API = (window.PEPTIDE_API_BASE || '');
    var STORE_KEY = 'enl_admin_key';
    var lastKey = '';
    var products = [];
    var categories = [];
    var newImageData = '';   // set when the admin picks a new image file

    var $ = function (id) { return document.getElementById(id); };
    var form = $('productForm');
    var statusEl = $('adminStatus');
    var listEl = $('productList');
    var msgEl = $('formMsg');

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
    function money(n) { return '$' + (Number(n) || 0).toFixed(2); }
    function token() { try { return localStorage.getItem('enl_token') || ''; } catch (e) { return ''; } }
    function setStatus(html, kind) { statusEl.className = 'form-msg' + (kind ? ' ' + kind : ''); statusEl.innerHTML = html || ''; }
    function setMsg(text, kind) { msgEl.className = 'form-msg' + (kind ? ' ' + kind : ''); msgEl.textContent = text || ''; }
    function headers(withJson) {
      var h = {};
      if (withJson) h['Content-Type'] = 'application/json';
      var t = token(); if (t) h['Authorization'] = 'Bearer ' + t;
      if (lastKey) h['x-admin-key'] = lastKey;
      return h;
    }

    /* ---- categories dropdown ---- */
    function fillCategories() {
      var sel = $('pCategory');
      sel.innerHTML = categories.map(function (c) { return '<option value="' + esc(c.key) + '">' + esc(c.name) + '</option>'; }).join('');
    }

    /* ---- spec rows ---- */
    function addSpecRow(key, val) {
      var wrap = document.createElement('div');
      wrap.className = 'spec-row';
      wrap.innerHTML = '<input class="spec-key" placeholder="Label (e.g. Molecular Weight)" value="' + esc(key || '') + '">' +
                       '<input class="spec-val" placeholder="Value" value="' + esc(val || '') + '">' +
                       '<button type="button" class="btn btn-ghost btn-sm spec-del">✕</button>';
      wrap.querySelector('.spec-del').addEventListener('click', function () { wrap.remove(); });
      $('specRows').appendChild(wrap);
    }
    function collectSpecs() {
      var specs = {};
      Array.prototype.forEach.call(document.querySelectorAll('#specRows .spec-row'), function (row) {
        var k = row.querySelector('.spec-key').value.trim();
        var v = row.querySelector('.spec-val').value.trim();
        if (k) specs[k] = v;
      });
      return specs;
    }

    /* ---- image: downscale to a reasonable data URL ---- */
    function shrinkImage(file, maxDim, cb) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);   // flatten transparency for JPEG
          ctx.drawImage(img, 0, 0, w, h);
          try { cb(canvas.toDataURL('image/jpeg', 0.82)); } catch (err) { cb(null); }
        };
        img.onerror = function () { cb(null); };
        img.src = e.target.result;
      };
      reader.onerror = function () { cb(null); };
      reader.readAsDataURL(file);
    }

    $('pImage').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      shrinkImage(file, 900, function (dataUrl) {
        if (!dataUrl) { setMsg('Could not read that image.', 'error'); return; }
        newImageData = dataUrl;
        var pv = $('imgPreview'); pv.src = dataUrl; pv.style.display = 'block';
        $('imgHint').textContent = Math.round(dataUrl.length / 1024) + ' KB (shrunk). Save to apply.';
      });
    });

    $('addSpecBtn').addEventListener('click', function () { addSpecRow('', ''); });

    /* ---- load + render the catalog ---- */
    function loadCatalog() {
      setStatus('Loading…', '');
      fetch(API + '/api/products', { headers: headers(false) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { setStatus(esc(res.d.error || 'Could not load products.'), 'error'); return; }
          products = res.d.products || [];
          categories = res.d.categories || [];
          fillCategories();
          renderList();
          setStatus(products.length + ' product' + (products.length === 1 ? '' : 's') + ' in the catalog.', 'success');
          checkBackendFeatures();
        })
        .catch(function () { setStatus("Can't reach the server. Is the backend awake?", 'error'); });
    }

    /* This page is deployed to the static host; the API lives somewhere else
       (Render). So the page can be newer than the server answering it, and the
       first sign of that would be a stock count that saves, looks right, and is
       gone on the next refresh. Ask the server what it supports and say so
       plainly instead. */
    function checkBackendFeatures() {
      fetch(API + '/api/health')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (h) {
          var supported = !!(h && h.features && h.features.stockCounts);
          var banner = $('featureWarn');
          if (!banner) return;
          banner.style.display = supported ? 'none' : 'block';
          if (!supported) {
            banner.innerHTML = '<strong>Stock counts won\'t save yet.</strong> The API this page is talking to ' +
              '(<code>' + esc(API || location.origin) + '</code>) is running a build from before stock counts existed. ' +
              'Deploy the current <code>server/</code> folder to your backend, then reload this page. ' +
              'Everything else on this page works normally.';
            // and make the dead controls look dead
            Array.prototype.forEach.call(listEl.querySelectorAll('.p-stock, .p-stock-save'), function (el) { el.disabled = true; });
            var f = $('pStock'); if (f) { f.disabled = true; }
          }
        })
        .catch(function () { /* health unreachable — the catalog load already said so */ });
    }

    /* The stock cell. Editable right here: changing a count is the one thing
       done often (after a delivery, after a recount), and routing it through
       the full edit form would mean re-sending the product's whole record —
       image data-URL and all — to change one number. */
    function stockCell(p) {
      var tracked = p.stockQty !== null && p.stockQty !== undefined;
      var n = tracked ? Number(p.stockQty) : null;
      var state = p.inStock === false ? '<span class="stock-tag off">not for sale</span>'
                : !tracked ? '<span class="stock-tag untracked">untracked</span>'
                : n === 0 ? '<span class="stock-tag out">sold out</span>'
                : n <= 5 ? '<span class="stock-tag low">' + n + ' left</span>'
                : '<span class="stock-tag ok">' + n + ' in stock</span>';
      return '<td class="stock-cell">' + state +
        '<span class="stock-edit">' +
          '<input type="number" class="p-stock" min="0" step="1" value="' + (tracked ? n : '') + '" ' +
                 'placeholder="—" aria-label="Units in stock for ' + esc(p.name) + '" data-id="' + esc(p.id) + '">' +
          '<button type="button" class="btn btn-ghost btn-sm p-stock-save" data-id="' + esc(p.id) + '">Save</button>' +
        '</span>' +
        /* The outcome belongs HERE, beside the control that caused it. It used
           to go only to the status bar at the top of the page, which on a nine-
           row table is off-screen — a failed save looked exactly like a
           successful one until the next refresh undid it. */
        '<span class="stock-note" data-id="' + esc(p.id) + '" role="status" aria-live="polite"></span>' +
        '</td>';
    }

    /* Result line under one row's stock control. */
    function stockNote(id, text, kind) {
      var el = listEl.querySelector('.stock-note[data-id="' + id + '"]');
      if (!el) return;
      el.className = 'stock-note' + (kind ? ' ' + kind : '');
      el.textContent = text || '';
    }

    function renderList() {
      $('pCount').textContent = products.length;
      if (!products.length) { listEl.innerHTML = '<p class="muted-sm" style="margin-top:1rem">No products yet.</p>'; return; }
      var rows = products.map(function (p) {
        var img = p.image || ('assets/vials/' + p.id + '.webp?v=8');
        var shown = p.published !== false;
        var coaStatus = (p.coa && p.coa.status) || '';
        var coaOk = coaStatus === 'available';
        return '<tr' + (shown ? '' : ' class="p-hidden"') + '>' +
          '<td><img class="p-thumb" src="' + esc(img) + '" alt="" onerror="this.style.visibility=\'hidden\'"></td>' +
          '<td><strong>' + esc(p.name) + '</strong>' + (p.featured ? ' <span class="order-status paid" style="font-size:0.6rem">featured</span>' : '') +
            '<span class="coa-flag ' + (coaOk ? 'ok' : 'no') + '">' +
              (coaOk ? 'COA ' + esc(p.coa.reportId || 'on file')
                     : coaStatus === 'not-applicable' ? 'COA n/a' : 'no COA') + '</span></td>' +
          '<td>' + esc(p.categoryName || p.category || '') + '</td>' +
          '<td>' + money(p.price) + '</td>' +
          /* The switch reads as what it controls — whether the product is on
             the shop — and states the current position in words, because a
             lone toggle never says which way is "on". */
          '<td><button type="button" class="vis-toggle' + (shown ? ' on' : '') + '" role="switch" aria-checked="' + shown + '"' +
            ' data-id="' + esc(p.id) + '" data-next="' + (!shown) + '">' +
            '<i></i><span>' + (shown ? 'On the shop' : 'Hidden') + '</span></button></td>' +
          stockCell(p) +
          '<td class="row-actions"><button class="btn btn-ghost btn-sm p-edit" data-id="' + esc(p.id) + '">Edit</button>' +
          '<button class="btn btn-ghost btn-sm p-del" data-id="' + esc(p.id) + '" data-name="' + esc(p.name) + '">Delete</button></td>' +
          '</tr>';
      }).join('');
      listEl.innerHTML = '<table class="adm-table"><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th>' +
        '<th>Visibility</th><th>Stock <span class="muted-sm">(blank = untracked)</span></th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
      Array.prototype.forEach.call(listEl.querySelectorAll('.vis-toggle'), function (b) {
        b.addEventListener('click', function () { setVisible(b.getAttribute('data-id'), b.getAttribute('data-next') === 'true', b); });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('.p-edit'), function (b) { b.addEventListener('click', function () { startEdit(b.getAttribute('data-id')); }); });
      Array.prototype.forEach.call(listEl.querySelectorAll('.p-del'), function (b) { b.addEventListener('click', function () { del(b.getAttribute('data-id'), b.getAttribute('data-name')); }); });
      Array.prototype.forEach.call(listEl.querySelectorAll('.p-stock-save'), function (b) {
        b.addEventListener('click', function () { saveStock(b.getAttribute('data-id'), b); });
      });
      Array.prototype.forEach.call(listEl.querySelectorAll('.p-stock'), function (inp) {
        inp.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          var btn = inp.parentNode.querySelector('.p-stock-save');
          saveStock(inp.getAttribute('data-id'), btn);
        });
      });
    }

    /* Show or hide one product on the storefront. Hiding does not touch stock,
       price or the COA — the listing is intact, it is simply off the shop. */
    function setVisible(id, next, btn) {
      btn.disabled = true;
      fetch(API + '/api/products/' + encodeURIComponent(id) + '/published', {
        method: 'PATCH', headers: headers(true), body: JSON.stringify({ published: next })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, d: d }; }); })
        .then(function (res) {
          btn.disabled = false;
          if (res.status === 401) { setStatus('Admin sign-in required.', 'error'); return; }
          if (res.status === 404 && !res.d.error) {
            setStatus('This backend does not have the show/hide switch yet — deploy the current server/.', 'error');
            return;
          }
          if (!res.ok) { setStatus(res.d.error || 'Could not change that.', 'error'); return; }
          var p = products.filter(function (x) { return String(x.id) === String(id); })[0];
          if (p) p.published = next;
          setStatus(res.d.product.name + (next ? ' is back on the shop.' : ' is hidden from the shop.'), 'success');
          renderList();
        })
        .catch(function () { btn.disabled = false; setStatus("Can't reach the server.", 'error'); });
    }

    /* Save one count. Blank clears the count back to untracked, which is the
       only way to undo "start counting this product". */
    function saveStock(id, btn) {
      var inp = listEl.querySelector('.p-stock[data-id="' + id + '"]');
      if (!inp) return;
      var raw = inp.value.trim();
      var payload = { stockQty: raw === '' ? null : Number(raw) };
      if (raw !== '' && (!isFinite(payload.stockQty) || payload.stockQty < 0)) {
        setStatus('Stock must be a whole number of 0 or more (or blank for untracked).', 'error');
        return;
      }
      var label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Saving…';
      stockNote(id, '');
      fetch(API + '/api/products/' + encodeURIComponent(id) + '/stock', {
        method: 'PATCH', headers: headers(true), body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, d: d }; }); })
        .then(function (res) {
          btn.disabled = false; btn.textContent = label;
          if (res.status === 401) {
            stockNote(id, 'Admin sign-in required', 'error');
            setStatus('Admin access required — sign in with the admin account, or use an admin key below.', 'error');
            if ($('adminKeyBox')) $('adminKeyBox').open = true;
            return;
          }
          /* A 404 here means the API answered but has no such route — i.e. the
             backend is running a build from before stock counts existed. The
             count would appear to save and be gone on the next refresh, so name
             the actual cause rather than "could not save". */
          if (res.status === 404) {
            stockNote(id, 'Backend out of date', 'error');
            setStatus('This server does not have the stock endpoint yet. Deploy the current <code>server/</code> to your backend (Render), then reload — until then stock counts cannot be saved.', 'error');
            return;
          }
          if (!res.ok) {
            stockNote(id, res.d.error || 'Not saved', 'error');
            setStatus(res.d.error || 'Could not save the stock count.', 'error');
            return;
          }
          // repaint from the server's copy so the tag matches what was stored
          for (var i = 0; i < products.length; i++) {
            if (String(products[i].id) === String(id)) { products[i] = res.d.product; break; }
          }
          renderList();
          stockNote(id, 'Saved', 'success');
          setStatus('Stock updated for ' + esc(res.d.product.name) + '.', 'success');
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = label;
          stockNote(id, "Can't reach the server", 'error');
          setStatus("Can't reach the server.", 'error');
        });
    }

    /* ---- form fill / reset ---- */
    function resetForm() {
      form.removeAttribute('data-editing');
      form.reset();
      $('specRows').innerHTML = '';
      newImageData = '';
      $('imgPreview').style.display = 'none';
      $('imgHint').textContent = 'Leave empty to keep the current image (research vials use a generated label if none).';
      $('formTitle').textContent = 'Add a product';
      $('saveBtn').textContent = 'Add product';
      $('cancelBtn').style.display = 'none';
      $('pInStock').checked = true;
      $('pStock').value = '';
      fillCoa(null);                 // clears every COA field back to "pending"
      setMsg('');
      $('formCard').hidden = true;   // back to the list, which is the default view
    }

    /* Open the empty form on demand. */
    $('newProductBtn').addEventListener('click', function () {
      resetForm();
      $('formCard').hidden = false;
      fillCategories();
      $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('pName').focus();
    });

    function startEdit(id) {
      var p = products.filter(function (x) { return String(x.id) === String(id); })[0];
      if (!p) return;
      form.setAttribute('data-editing', String(p.id));
      $('pName').value = p.name || '';
      fillCategories();
      $('pCategory').value = p.category || '';
      $('pBadge').value = p.badge || '';
      $('pPrice').value = (p.price != null ? p.price : '');
      $('pOriginal').value = (p.originalPrice != null ? p.originalPrice : '');
      $('pPurity').value = p.purity || '';
      $('pQuantity').value = p.quantity || '';
      $('pLot').value = p.lot || '';
      $('pInStock').checked = p.inStock !== false;
      $('pStock').value = (p.stockQty === null || p.stockQty === undefined) ? '' : p.stockQty;
      $('pFeatured').checked = !!p.featured;
      $('pDescription').value = p.description || '';
      fillCoa(p);
      $('specRows').innerHTML = '';
      var specs = p.specs || {};
      Object.keys(specs).forEach(function (k) { addSpecRow(k, specs[k]); });
      newImageData = '';
      var pv = $('imgPreview');
      if (p.image) { pv.src = p.image; pv.style.display = 'block'; }
      else { pv.style.display = 'none'; }
      $('imgHint').textContent = 'Leave empty to keep the current image.';
      $('formTitle').textContent = 'Edit: ' + p.name;
      $('saveBtn').textContent = 'Save changes';
      $('cancelBtn').style.display = 'inline-flex';
      setMsg('');
      $('formCard').hidden = false;
      $('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('cancelBtn').addEventListener('click', resetForm);

    /* ---- certificate of analysis ----
       The document is stored the same way a product image is: a data URL on
       the product record. That keeps a COA uploaded from the admin page
       working on a host where this app cannot write files (GoDaddy serves the
       site; the API lives elsewhere). Pointing at a path already on the site —
       assets/coa/137638.pdf — stays supported and is the lighter option for a
       file you can upload by FTP. */
    var newCoaData = '';        // set when a new document is chosen
    var newCoaName = '';

    function coaFieldsVisible() {
      var status = $('pCoaStatus').value;
      $('coaFields').style.display = status === 'available' ? '' : 'none';
    }
    $('pCoaStatus').addEventListener('change', coaFieldsVisible);

    $('pCoaFile').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) { newCoaData = ''; newCoaName = ''; return; }
      // 6MB keeps it inside the API's JSON body limit with room to spare.
      if (file.size > 6 * 1024 * 1024) {
        setMsg('That document is over 6MB. Upload it to assets/coa/ by FTP and enter its path instead.', 'error');
        this.value = '';
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        newCoaData = String(reader.result || '');
        newCoaName = file.name;
        $('coaFileHint').textContent = 'Ready to save: ' + file.name;
      };
      reader.readAsDataURL(file);
    });

    function collectCoa() {
      var status = $('pCoaStatus').value;
      var coa = { status: status };
      var note = $('pCoaNote').value.trim();
      if (note) coa.note = note;

      if (status === 'available') {
        var map = { lab: 'pCoaLab', reportId: 'pCoaReport', batch: 'pCoaBatch', method: 'pCoaMethod',
                    testDate: 'pCoaTested', reportDate: 'pCoaIssued', purity: 'pCoaPurity',
                    content: 'pCoaContent', verifyUrl: 'pCoaVerify' };
        Object.keys(map).forEach(function (k) {
          var v = $(map[k]).value.trim();
          if (v) coa[k] = v;
        });
      }
      // A newly uploaded document wins; otherwise whatever path is in the box
      // (which startEdit pre-fills with the current one, so it survives edits).
      if (newCoaData) coa.file = newCoaData;
      else {
        var path = $('pCoaPath').value.trim();
        if (path) coa.file = path;
      }
      return coa;
    }

    function fillCoa(p) {
      var coa = (p && p.coa) || {};
      $('pCoaStatus').value = coa.status || 'pending';
      $('pCoaLab').value = coa.lab || '';
      $('pCoaReport').value = coa.reportId || '';
      $('pCoaBatch').value = coa.batch || '';
      $('pCoaMethod').value = coa.method || '';
      $('pCoaTested').value = coa.testDate || '';
      $('pCoaIssued').value = coa.reportDate || '';
      $('pCoaPurity').value = coa.purity || '';
      $('pCoaContent').value = coa.content || '';
      $('pCoaVerify').value = coa.verifyUrl || '';
      $('pCoaNote').value = coa.note || '';
      newCoaData = ''; newCoaName = '';
      $('pCoaFile').value = '';

      // An uploaded document is a data: URL — far too long for a text box, so
      // the box holds only real paths and the link opens whatever is stored.
      var file = coa.file || '';
      var isUpload = /^data:/.test(file);
      $('pCoaPath').value = isUpload ? '' : file;
      var link = $('coaFileLink');
      if (file) {
        link.href = file;
        link.style.display = '';
        $('coaFileHint').textContent = isUpload
          ? 'A document is stored on this product. Choose a file to replace it.'
          : 'Currently pointing at ' + file;
      } else {
        link.style.display = 'none';
        $('coaFileHint').textContent = 'No document yet. Upload one, or enter a path like assets/coa/137638.pdf.';
      }
      coaFieldsVisible();
    }

    /* ---- save (add or update) ---- */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('pName').value.trim();
      if (!name) { setMsg('Please enter a product name.', 'error'); return; }
      if ($('pPrice').value === '' || isNaN(Number($('pPrice').value))) { setMsg('Please enter a valid price.', 'error'); return; }

      var body = {
        name: name,
        category: $('pCategory').value,
        badge: $('pBadge').value.trim(),
        price: $('pPrice').value,
        originalPrice: $('pOriginal').value,
        purity: $('pPurity').value.trim(),
        quantity: $('pQuantity').value.trim(),
        lot: $('pLot').value.trim(),
        inStock: $('pInStock').checked,
        // '' → null tells the server to stop counting this one (see normalizeStock)
        stockQty: $('pStock').value.trim() === '' ? null : Number($('pStock').value),
        featured: $('pFeatured').checked,
        description: $('pDescription').value.trim(),
        specs: collectSpecs(),
        coa: collectCoa()
      };
      if (newImageData) body.image = newImageData;   // only send when a new image was chosen

      var editingId = form.getAttribute('data-editing');
      var url = API + '/api/products' + (editingId ? '/' + encodeURIComponent(editingId) : '');
      var method = editingId ? 'PUT' : 'POST';

      var btn = $('saveBtn'); var label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Saving…';
      fetch(url, { method: method, headers: headers(true), body: JSON.stringify(body) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, d: d }; }); })
        .then(function (res) {
          btn.disabled = false; btn.textContent = label;
          if (res.status === 401) { setMsg('Admin access required — sign in with the admin account, or use an admin key below.', 'error'); if ($('adminKeyBox')) $('adminKeyBox').open = true; return; }
          if (!res.ok) { setMsg(res.d.error || 'Could not save the product.', 'error'); return; }
          resetForm();
          loadCatalog();
        })
        .catch(function () { btn.disabled = false; btn.textContent = label; setMsg("Can't reach the server.", 'error'); });
    });

    /* ---- delete ---- */
    function del(id, name) {
      if (!window.confirm('Delete "' + name + '"? This removes it from the store. This cannot be undone.')) return;
      fetch(API + '/api/products/' + encodeURIComponent(id), { method: 'DELETE', headers: headers(false) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (res.status === 401) { setStatus('Admin access required to delete.', 'error'); return; }
          if (!res.ok) { window.alert(res.d.error || 'Could not delete.'); return; }
          loadCatalog();
        })
        .catch(function () { window.alert("Can't reach the server."); });
    }

    /* ---- admin key fallback ---- */
    try { lastKey = localStorage.getItem(STORE_KEY) || ''; } catch (e) {}
    $('keyForm').addEventListener('submit', function (e) {
      e.preventDefault();
      lastKey = $('adminKey').value.trim();
      try { localStorage.setItem(STORE_KEY, lastKey); } catch (e2) {}
      loadCatalog();
    });
    try { if (lastKey) $('adminKey').value = lastKey; } catch (e) {}

    // boot
    resetForm();
    loadCatalog();
  })();
  </script>
</body>
</html>
